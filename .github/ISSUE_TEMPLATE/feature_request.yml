name: Feature or harness request
description: Ask for a new capability, or support for another agent harness.
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind of request
      options:
        - A new capability or option
        - Support for another harness (agent tool)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation and what is missing today. Use invented examples, not your own history.
    validations:
      required: true
  - type: textarea
    id: harness
    attributes:
      label: For a new harness, the on-disk format
      description: |
        Where its sessions live, file format (JSONL, SQLite, ...), and how user messages, assistant answers and
        tool calls are recorded: field names and structure, every value replaced with a placeholder.
        Links to the tool's own documentation help.
      placeholder: |
        Tool: <name and version>, sessions in ~/.tool/sessions/<project>/<id>.jsonl
        user turn:      {"role": "user", "content": "<prompt>", "ts": "<iso time>"}
        assistant turn: {"role": "assistant", "content": [{"type": "text", "text": "<answer>"}]}
        tool call:      {"role": "assistant", "content": [{"type": "tool_use", "name": "bash", "input": {"command": "<cmd>"}}]}
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Optional. A command line, an output example, or where in the code it would go.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request contains no real conversation text, paths, names, ids or secrets from my history.
          required: true
