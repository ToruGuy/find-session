name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real conversation content, paths, project names, session ids or tokens from your own history.**
        Session files hold everything you ever told an agent. Describe the *shape* of the data instead,
        with invented values, for example: `a Codex session whose first line is {"type": "session_meta", "payload": {...}}`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what you expected instead. Replace your own words, paths and ids with invented ones.
      placeholder: |
        python3 sessions.py search "invoice export" --source codex
        Expected the session about the export, got no results.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Shape of the data
      description: |
        Which tool wrote the session (Claude Code, Codex, omp, version if you know it) and the structure of the
        records involved: field names and types, with every value replaced (`"text": "<user prompt>"`).
      placeholder: |
        Codex 0.x, file ~/.codex/sessions/YYYY/MM/DD/rollout-<id>.jsonl
        {"type": "response_item", "payload": {"type": "message", "role": "user", "content": [{"type": "input_text", "text": "<prompt>"}]}}
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error
      description: Error messages and tracebacks are useful; search results quote your history, so cut them down to the structure.
      render: text
  - type: input
    id: version
    attributes:
      label: find-session version
      description: Output of `sessions.py --version` (or `npx find-session --version`).
      placeholder: find-session 0.3.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: macOS 15, Python 3.12
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real conversation text, paths, names, ids or secrets from my history.
          required: true
